---
- name: Vérifie la présence d'une clé publique dans authorized_keys (sinon STOP)
  ansible.builtin.stat:
    path: "/home/{{ workshop_user }}/.ssh/authorized_keys"
  register: ak

- name: Refuse de continuer si aucune clé publique n'est déjà déposée
  ansible.builtin.assert:
    that:
      - ak.stat.exists
      - ak.stat.size > 0
    fail_msg: >
      Aucune clé publique trouvée dans
      /home/{{ workshop_user }}/.ssh/authorized_keys.
      Pousse-la d'abord avec `ssh-copy-id {{ workshop_user }}@{{ ansible_host }}`
      sinon le durcissement va t'enfermer dehors.

- name: Drop-in hardening sshd (10-hardening.conf, gagne contre 50-cloud-init.conf)
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: reload sshd

- name: Valide la conf sshd (sshd -t)
  ansible.builtin.command: sshd -t
  changed_when: false

- name: Force le flush du handler pour reload sshd avant la fin du play
  ansible.builtin.meta: flush_handlers
