---
- name: Configure jail.local
  ansible.builtin.copy:
    src: jail.local
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: fail2ban actif au démarrage
  ansible.builtin.systemd:
    name: fail2ban
    state: started
    enabled: true
