name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_BASE: ghcr.io/kylian14/ia-cking

jobs:
  security-scan:
    name: Scan sécurité (Trivy + code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy (scan du dépôt)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          format: table
          exit-code: '0'

      - name: Bandit (SAST backend Python)
        run: |
          python -m pip install --quiet bandit
          bandit -r backend -ll

  build-and-push:
    name: Build & push images (GHCR)
    needs: security-scan
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (local) pour scan
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE_BASE }}-${{ matrix.service }}:scan
          provenance: false
          sbom: false

      - name: Trivy (scan image)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_BASE }}-${{ matrix.service }}:scan
          severity: CRITICAL,HIGH
          format: table
          exit-code: '0'

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (latest + sha)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:latest
            ${{ env.IMAGE_BASE }}-${{ matrix.service }}:${{ github.sha }}
          provenance: false
          sbom: false
