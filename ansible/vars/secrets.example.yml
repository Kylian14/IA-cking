# Secrets à chiffrer avec ansible-vault avant utilisation :
#   ansible-vault encrypt vars/secrets.yml
#
# Fournir au lancement :
#   ansible-playbook ... -e @vars/secrets.yml --ask-vault-pass

# Clé OpenRouter dédiée à l'event (à révoquer après).
vault_openrouter_api_key: "sk-or-v1-REPLACE-ME"

# Mot de passe admin du dashboard (>= 20 caractères, robuste).
vault_admin_password: "REPLACE-ME-WITH-A-STRONG-PASSPHRASE"

# Optionnel : si vide, le playbook génère un secret aléatoire (64 hex)
# au premier run et le stocke dans .env. Si défini, on l'utilise tel quel
# (utile pour des redéploiements idempotents).
vault_session_secret: ""

# Optionnel : mot de passe sudo. Sinon utiliser --ask-become-pass.
# ansible_become_password: "REPLACE-ME"
