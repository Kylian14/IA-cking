# nginx de l'atelier : version HTTP par défaut (dev local + démarrage rapide).
# Sert les statiques et reverse-proxy /api et /admin vers le backend.
#
# Pour un déploiement LAN/prod en HTTPS (cert auto-signé), le rôle Ansible
# `workshop` monte une variante TLS de ce fichier (cf. roles/workshop/
# templates/nginx.conf.j2) par-dessus /etc/nginx/nginx.conf, sans modifier
# ce fichier versionné.

worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' (script-src) : chaque page embarque un unique <script>
    # de bootstrap inline et aucun .js externe, c'est volontaire.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on; gzip_vary on; gzip_min_length 1024; gzip_proxied any;
    gzip_comp_level 6; gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream backend_student { server backend:8000; }
    upstream backend_admin   { server backend:8001; }

    # ============================================================
    # ÉLÈVE : port 8000
    # ============================================================
    server {
        listen 8000 default_server;
        server_name _;

        root /usr/share/nginx/html;

        location = /     { try_files /student.html =404; }
        location = /demo { try_files /demo.html    =404; }

        location ~ ^/static/(?<asset>[\w.\-]+\.(?:css|js|woff2?|ttf|svg|png|ico))$ {
            alias /usr/share/nginx/html/$asset;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        location = /api/ws {
            proxy_pass http://backend_student;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        location /api/ {
            proxy_pass http://backend_student;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://backend_student/health;
            access_log off;
        }

        location / { return 404; }
    }

    # ============================================================
    # ADMIN : port 8001
    # ============================================================
    server {
        listen 8001 default_server;
        server_name _;

        root /usr/share/nginx/html;

        location = /           { try_files /admin.html      =404; }
        location = /scoreboard { try_files /scoreboard.html =404; }

        location ~ ^/static/(?<asset>[\w.\-]+\.(?:css|js|woff2?|ttf|svg|png|ico))$ {
            alias /usr/share/nginx/html/$asset;
            expires 1h;
        }

        location = /admin/ws/monitor {
            proxy_pass http://backend_admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        location /admin/ {
            proxy_pass http://backend_admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://backend_admin/health;
            access_log off;
        }

        location / { return 404; }
    }
}
